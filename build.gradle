// CoxScouter Plugin Module - External CoX Scouter integration
// Original plugin by Blackberry0Pie: https://github.com/Blackberry0Pie/CoX-Scouter-External
// Integrated as submodule with build system adaptation

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
        }
    }
}

// Plugin-specific JAR configuration
jar {
    archiveBaseName.set('Swaid-CoxScouter')
}

// Plugin-specific core module dependencies
dependencies {
    // CoxScouter can leverage these core modules for enhanced functionality:
    implementation project(':swaid:core-modules:core-a1central')     // For shared PvM utilities
    implementation project(':swaid:core-modules:core-kotoriutils')   // For prayer and utility functions
    implementation project(':swaid:core-modules:core-swaidutils')    // For performance optimizations
}